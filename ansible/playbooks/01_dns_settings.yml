--- 
- name: edgestream-hub
  hosts: localhost
  connection: local
  gather_facts: no
  ignore_errors: true
  become: yes
  
  vars:
    version: "1.0"
    mode: "configure"
    
  vars_files:
    - /opt/edgestream-core/etc/source_path.yml
    - "{{ edgestream_settings_file }}"
    
  roles:
    - {role: "dns-settings", tags: ["dns-settings"]}
