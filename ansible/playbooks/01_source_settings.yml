--- 
- name: edgestream-hub
  hosts: localhost
  connection: local
  gather_facts: no
  ignore_errors: true
  
  vars:
    version: "1.0"
    mode: "configure"
    
  vars_files:
    - /opt/edgestream-core/etc/source_path.yml
    - "{{ edgestream_settings_file }}"
    
  roles:
    - {role: "post-init", tags: ["post-init"]}
    - {role: "certificate-settings", tags: ["certificate-settings"]}
    - {role: "o365audit-settings", tags: ["o365audit-settings"]}
    - {role: "syslog-settings", tags: ["syslog-settings"]}
    - {role: "vector-settings", tags: ["vector-settings"]}
    - {role: "netflow-settings", tags: ["netflow-settings"]}
    - {role: "wec-settings", tags: ["wec-settings"]}
    