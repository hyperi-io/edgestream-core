- name: "[vector-settings.grpcwebproxy]: Install grpcwebproxy from repository"
  ansible.builtin.apt:
    name: grpcwebproxy
    state: present
  notify: "Restart grpcwebproxy"

- name: "[vector-settings.grpcwebproxy]: Ensure service is running"
  ansible.builtin.systemd:
    name: grpcwebproxy
    state: started
    enabled: true
    daemon_reload: true
